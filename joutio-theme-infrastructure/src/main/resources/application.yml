spring:
  config:
    import: optional:classpath:joutio-defaults.yml
  application:
    name: joutio-theme
  profiles:
    default: local

  flyway:
    locations: classpath:db/migration/theme

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

microservice:
  swagger:
    description: Joutio Theme Module - Quiz Topics and Questions management
  websocket:
    enabled: false

app:
  seed-data:
    enabled: true

joutio:
  question-report:
    auto-suspension:
      enabled: true
      threshold: 3
      window: P7D


