server:
  port: 8086

spring:
  config:
    import: optional:classpath:joutio-local.yml
    activate:
      on-profile: local

  datasource:
    url: jdbc:postgresql://localhost:5432/joutio_theme
    username: postgres
    password: postgres

app:
  seed-data:
    enabled: true
    image-base-url: ${JOUTIO_SEED_IMAGE_BASE_URL:http://localhost:9000/joutio-media/}
